name: Update Filter List

on:
  schedule:
    # Daily at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "sources.txt"
      - "custom-rules.txt"
      - "scripts/merge.sh"

# Prevent overlapping runs from committing conflicting changes.
concurrency:
  group: update-filter-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Merge and publish filters
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate merge script
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f scripts/merge.sh
          test -x scripts/merge.sh || chmod +x scripts/merge.sh

      - name: Generate filter list
        shell: bash
        run: |
          set -Eeuo pipefail

          bash scripts/merge.sh

          test -f filters.txt
          test -s filters.txt

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- filters.txt

          if git diff --cached --quiet -- filters.txt; then
            echo "No changes to filters.txt"
            exit 0
          fi

          rules="$(wc -l < filters.txt | tr -d ' ')"

          git commit \
            -m "chore(filters): auto-update filter list (${rules} rules) [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          
