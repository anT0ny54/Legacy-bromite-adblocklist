name: Validate Filters

on:
  push:
    branches:
      - main
    paths:
      - "filters.txt"
      - "custom-rules.txt"
      - "scripts/merge.sh"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "filters.txt"
      - "custom-rules.txt"
      - "scripts/merge.sh"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-filters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate filters.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate test script
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f tests/validate-filters.sh
          chmod +x tests/validate-filters.sh
          bash -n tests/validate-filters.sh

      - name: Validate filters.txt
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f filters.txt
          test -s filters.txt
          ./tests/validate-filters.sh filters.txt

      - name: Show filter statistics
        shell: bash
        run: |
          set -Eeuo pipefail
          rules=$(grep -Ec '^(\|\||@@\|\||\|https?://)' filters.txt || true)
          comments=$(grep -Ec '^!' filters.txt || true)
          bytes=$(wc -c < filters.txt | tr -d ' ')
          lines=$(wc -l < filters.txt | tr -d ' ')
          echo "### filters.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lines: $lines" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rules: $rules" >> "$GITHUB_STEP_SUMMARY"
          echo "- Comments: $comments" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
